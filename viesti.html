<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <title>Tower Brewing Co.</title> 
</head>
<body>
  <ul>
    <li><a href="index.html">Koti</a></li>
    <li><a href="tuotteet.html">Tuotteet</a></li>
    <li><a href="tietoja.html">Tietoja meistä</a></li>
    <li><a href="viesti.html">Lähetä meille viestisi</a></li>
  </ul>
  <h2>Lähetä viestiä meille!</h2><br><br><br>
  
  <div class="kysymys-kontti">  
    <form class="kysymys-formi">
      <label for="nimi">Nimi:</label><br>
      <input type="text" id="nimi" name="nimi" value="Matti Meikeläinen" onclick="this.select();"><br><br>
      <label for="sukupuoli">Sukupuolesi:</label>
      <select id="sukupuoli" name="sukupuoli">
        <option value="mies">Mies</option>
        <option value="nainen">Nainen</option>
        <option value="muu">Muu</option>
      </select><br><br>
      <label for="email">Email:</label><br>
      <input type="text" id="email" name="email" value="olut@tower.fi" onclick="this.select();"><br><br>
      <label for="viesti">Viestisi meille:</label><br>
      <textarea name="viesti" style="width:300px; height:150px;">Olut on hyvää!</textarea><br><br>
      <input type="submit" value="Lähetä">
    </form> 
  </div>
    

</body>
</html>
